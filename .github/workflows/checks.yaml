name: Check shared Actions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Action and workflow metadata
        uses: mpalmer/action-validator@c994f427b7c42cd5ecb1bc9315cb91c3d7d72e3d
        with:
          version: '0.9.0'
          patterns: |
            :(glob)*/action.yml
            .github/workflows/*.yaml
      - name: Check workflow expressions
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar --no-same-owner -xz -C "$RUNNER_TEMP" actionlint
          # actionlint 1.7.12 predates GitHub's self repository references.
          "$RUNNER_TEMP/actionlint" -ignore 'specifying action "\$/[^"]+" in invalid format because ref is missing' .github/workflows/*.yaml

  plan:
    runs-on: ubuntu-22.04
    outputs:
      hosts: ${{ steps.plan.outputs.tests }}
    steps:
      - uses: $/build-plan
        id: plan

  version:
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v4
      - name: Check script syntax and release-source policy
        shell: bash
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          for script in scripts/*.cjs; do node --check "$script"; done
          node --test test/*.test.cjs
      - shell: bash
        run: |
          echo 'version: "1.2.3-rc.1+42"' > pubspec.yaml
      - id: version
        uses: $/read-version
      - name: Check composite outputs
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NAME: ${{ steps.version.outputs.build-name }}
        run: test "$VERSION" = '1.2.3-rc.1' && test "$BUILD_NAME" = '1.2.3'
      - name: Check build environment
        id: config
        shell: bash
        env:
          APP_DIR: example
          ARTIFACT_NAME: sample
          FLUTTER_VERSION: fixture-sdk
          TARGET: web
          ARCH: ''
          ANDROID_SIGNING: 'true'
          IOS_SIGNING: 'true'
        run: bash scripts/configure-build.sh
      - name: Check configured Web version and script path
        shell: bash
        run: |
          test "$VERSION" = "1.2.3-rc.1" && test "$BUILD_NAME" = "1.2.3-rc.1" && test "$ARCH" = browser
          test -f "$MP_BUILD_SCRIPTS/build.sh"
          test "$ANDROID_SIGNING" = false && test "$IOS_SIGNING" = false
      - name: Check the preinstalled Chrome path
        if: runner.os != 'Linux' || runner.arch != 'ARM64'
        shell: bash
        run: bash scripts/setup-browser.sh
      - name: Check the native PowerShell path and syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = "$env:MP_BUILD_SCRIPTS/windows.ps1"
          if (!(Test-Path $path)) { throw 'Shared PowerShell script was not found' }
          $tokens = $null; $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
