name: Build and test Flutter applications

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      app-directory:
        type: string
        default: .
      flutter-version:
        type: string
        default: ''
      include:
        type: string
        default: '[]'
      exclude:
        type: string
        default: '[]'
    secrets:
      ANDROID_KEYSTORE_BASE64: {required: false}
      ANDROID_KEYSTORE_PASSWORD: {required: false}
      ANDROID_KEY_ALIAS: {required: false}
      ANDROID_KEY_PASSWORD: {required: false}
      IOS_CERTIFICATE_BASE64: {required: false}
      IOS_CERTIFICATE_PASSWORD: {required: false}
      IOS_PROFILE_BASE64: {required: false}
      IOS_EXPORT_OPTIONS_BASE64: {required: false}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      tests: ${{ steps.plan.outputs.tests }}
      browsers: ${{ steps.plan.outputs.browsers }}
      wasm: ${{ steps.plan.outputs.wasm }}
      full: ${{ steps.plan.outputs.full }}
      manifest: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: $/build-plan
        id: plan
        with:
          include: ${{ inputs.include }}
          exclude: ${{ inputs.exclude }}

  tests:
    needs: plan
    name: Tests (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: $/setup-flutter
        with:
          flutter-version: ${{ inputs.flutter-version }}
      - name: VM unit and widget tests
        run: bash .github/scripts/test.sh vm

  browser-tests:
    needs: [plan, build]
    if: needs.plan.outputs.browsers != '[]'
    name: Browser tests (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.browsers) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: $/setup-flutter
        with:
          flutter-version: ${{ inputs.flutter-version }}
      - name: Apply Flutter browser-test SDK fixes
        run: node "$MP_BUILD_SCRIPTS/prepare-web-tests.cjs"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/web-artifact
          digest-mismatch: error
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Configure Chrome for the test host
        env:
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bash "$MP_BUILD_SCRIPTS/setup-browser.sh"
      - name: Smoke test the built Web archive
        run: bash "$MP_BUILD_SCRIPTS/smoke-web.sh" "$RUNNER_TEMP/web-artifact"
      - name: Browser tests
        run: bash .github/scripts/test.sh ${{ matrix.runtime }}

  build:
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: $/flutter-build
        with:
          target: ${{ matrix.target }}
          architecture: ${{ matrix.arch }}
          app-directory: ${{ inputs.app-directory }}
          artifact-name: ${{ inputs.artifact-name }}
          flutter-version: ${{ inputs.flutter-version }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ios-certificate-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          ios-certificate-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          ios-profile-base64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ios-export-options-base64: ${{ secrets.IOS_EXPORT_OPTIONS_BASE64 }}

  complete:
    needs: [plan, tests, browser-tests, build]
    # browser-tests is skipped when no Web platform is selected, which must not skip this job.
    if: >-
      always() &&
      needs.plan.outputs.full == 'true' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      needs.tests.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.browser-tests.result == 'success' || needs.browser-tests.result == 'skipped')
    runs-on: ubuntu-22.04
    steps:
      - name: Record the verified platform selection
        env:
          MANIFEST: ${{ needs.plan.outputs.manifest }}
        run: printf '%s\n' "$MANIFEST" > full-build-success.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-build-success
          path: full-build-success.json
          retention-days: 90

  pages:
    needs: [plan, tests, browser-tests, build]
    if: >-
      needs.plan.outputs.wasm == 'true' &&
      (github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')))
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: $/deploy-pages
        with:
          target-folder: ${{ github.ref_name == 'develop' && 'develop' || '' }}
          dry-run: ${{ github.event_name == 'pull_request' }}
