name: Verify Wasm disc identification
on:
  push:
    branches: ['debug/macos-wasm-20261015']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    defaults:
      run:
        shell: bash
        working-directory: packages/fnesemu_core
    steps:
      - uses: actions/checkout@v4
        with:
          repository: reki2000/fnesemu
          ref: 4ed54cd8e2836bdf38cc13b6980c6e2b463373a7
          submodules: recursive
          persist-credentials: false
      - uses: $/setup-flutter
      - run: bash "$MP_BUILD_SCRIPTS/setup-browser.sh"
      - name: Both PlayStation signatures and remaining factory cases
        timeout-minutes: 2
        run: |
          dart pub get
          bash "$MP_BUILD_SCRIPTS/test.sh" dart wasm --reporter expanded test/core/core_factory_test.dart
