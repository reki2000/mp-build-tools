name: Diagnose nested browser suites
on:
  push:
    branches: ['debug/macos-wasm-20261015']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: reki2000/fnesemu
          ref: 1f3d1b9109c0bf7d6a268baf051fc0244d2d2ef3
          submodules: recursive
          persist-credentials: false
      - uses: $/setup-flutter
      - name: Prepare the SDK and browser
        run: |
          node "$MP_BUILD_SCRIPTS/prepare-web-tests.cjs"
          bash "$MP_BUILD_SCRIPTS/setup-browser.sh"
          flutter pub get
      - name: Existing SDK nested browser suite
        continue-on-error: true
        timeout-minutes: 3
        run: flutter test --platform chrome test/gui/core_boundary_test.dart --verbose
      - name: Normalize the nested browser selector URL
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const file = path.join(process.env.FLUTTER_ROOT, 'packages/flutter_tools/lib/src/test/flutter_web_platform.dart');
          const source = fs.readFileSync(file, 'utf8');
          const updated = source.replace(/shelf.Response _wrapperHandler[\s\S]*?\n  }/, handler => handler.replace('_fileSystem.path.fromUri(request.url)', 'request.url.path'));
          console.log('Patched nested selector:', source !== updated);
          fs.writeFileSync(file, updated);
          for (const name of ['flutter_tools.snapshot', 'flutter_tools.stamp']) fs.rmSync(path.join(process.env.FLUTTER_ROOT, 'bin/cache', name), {force: true});
          JS
      - name: Fixed SDK nested browser suite
        timeout-minutes: 4
        run: flutter test --platform chrome test/gui/core_boundary_test.dart --verbose
