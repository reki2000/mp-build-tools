name: Diagnose browser fixes
on:
  push:
    branches: ['debug/macos-wasm-20261015']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  intel:
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: reki2000/mp_bigfile_picker
          ref: 97b367f3add6bd2f326d7ad5e53c8a3506f12d0f
          persist-credentials: false
      - uses: $/setup-flutter
      - run: |
          node "$MP_BUILD_SCRIPTS/prepare-web-tests.cjs"
          bash "$MP_BUILD_SCRIPTS/setup-browser.sh"
      - name: Wasm suites with software rendering
        timeout-minutes: 5
        run: |
          flutter pub get
          bash "$MP_BUILD_SCRIPTS/test.sh" flutter wasm test/web_access_test.dart
          cd example
          flutter pub get
          bash "$MP_BUILD_SCRIPTS/test.sh" flutter wasm
  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: reki2000/fnesemu
          ref: 1f3d1b9109c0bf7d6a268baf051fc0244d2d2ef3
          submodules: recursive
          persist-credentials: false
      - uses: $/setup-flutter
      - run: bash "$MP_BUILD_SCRIPTS/setup-browser.sh"
      - name: Core factory in isolation
        timeout-minutes: 3
        working-directory: packages/fnesemu_core
        run: |
          dart pub get
          bash "$MP_BUILD_SCRIPTS/test.sh" dart wasm --reporter expanded test/core/core_factory_test.dart
      - name: All core suites without parallel Wasm instances
        timeout-minutes: 8
        working-directory: packages/fnesemu_core
        run: bash "$MP_BUILD_SCRIPTS/test.sh" dart wasm --reporter expanded
